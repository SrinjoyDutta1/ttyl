name: Release
# Push a tag like v0.3.0 to publish to PyPI and create a GitHub Release.
# PyPI uses trusted publishing (no API token): pypi.org > Your projects > Publishing,
# pending publisher: project ttyl, owner SrinjoyDutta1, repo ttyl, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing to PyPI
      contents: write   # the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/ttyl/__init__.py').read())[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but package is $version"; exit 1; }
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "ttyl $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
