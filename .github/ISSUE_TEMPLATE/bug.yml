name: Bug
description: Something in ttyl (terminal view or menu bar app) doesn't work
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
  - type: textarea
    id: log
    attributes:
      label: Menu bar app log (if it's the app)
      description: The last lines of `~/.local/state/ttyl/app.log`
      render: text
  - type: input
    id: versions
    attributes:
      label: ttyl version, macOS version, terminal app
      placeholder: "ttyl 0.2.0, macOS 26.5, Terminal.app"
