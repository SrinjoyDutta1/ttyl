[project]
name = "ttyl"
version = "0.2.0"
description = "Your coding agents on one screen, and they call you (ring ring) when they need you."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Srinjoy Dutta"}]
requires-python = ">=3.11"
dependencies = ["textual>=8", "rich>=13", "anthropic>=1.9"]
keywords = ["claude-code", "codex", "ai-agents", "terminal", "tui", "textual"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/SrinjoyDutta1/ttyl"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
ttyl = "ttyl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
